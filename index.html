<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Charity Ticker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
  @font-face{font-family:'FSSinclair';src:url('FSSinclair-Medium.otf') format('opentype');font-display:swap}
  :root{
    --bg:#0b0d10; --accent:#ffe14a; --text:#f4f5f0;
    --dim:#9aa3ad; --good:#6fe08a; --info:#63c7ff; --track:#303742;
    --page:transparent; --font:'FSSinclair','Barlow Condensed','Arial Narrow',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--page)}
  body{display:flex;flex-direction:column;justify-content:flex-end}
  body.top{justify-content:flex-start} body.center{justify-content:center}
  body{font-family:var(--font);color:var(--text);
       text-transform:uppercase;font-variant-numeric:tabular-nums;white-space:nowrap}
  #bar{display:flex;flex:none;width:1920px;height:56px;background:var(--bg);position:relative}
  #bar::before,#bar::after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3}
  #bar::before{top:0} #bar::after{bottom:0}

  #total{display:flex;align-items:center;gap:12px;padding:0 44px 0 20px;background:var(--accent);color:#0b0d10;
         clip-path:polygon(0 0,100% 0,calc(100% - 24px) 100%,0 100%);z-index:2;flex:none}
  #total .label{font-size:18px;font-weight:700;letter-spacing:2px}
  #raised{font-size:38px;font-weight:800;line-height:1}
  #goal{font-size:20px;font-weight:600;opacity:.75}

  .stripes{width:34px;flex:none;margin-left:-14px;
    background:repeating-linear-gradient(115deg,var(--accent) 0 6px,transparent 6px 12px);
    clip-path:polygon(40% 0,100% 0,60% 100%,0 100%)}

  #feed{flex:1;overflow:hidden;position:relative;min-width:0;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent);
            mask-image:linear-gradient(90deg,transparent,#000 36px,#000 calc(100% - 36px),transparent)}
  #track{display:flex;height:100%;width:max-content;will-change:transform}
  .group{display:flex;height:100%}
  .item{display:flex;align-items:center;gap:10px;padding:0 22px;font-size:24px;font-weight:600;letter-spacing:.5px}
  .item::after{content:"";width:8px;height:8px;background:var(--accent);transform:rotate(45deg);margin-left:34px}
  .tag{font-size:15px;font-weight:800;letter-spacing:2px;padding:2px 8px 1px;border:2px solid currentColor;color:var(--accent)}
  .tag.good{color:var(--good)} .tag.info{color:var(--info)}
  .val{color:var(--accent);font-weight:800}
  .sub{color:var(--dim);font-size:20px}

  #badge:not(:empty){padding:1px 6px;background:var(--bg)}
  #badge{position:absolute;right:4px;top:4px;font-size:11px;font-weight:700;letter-spacing:1px;color:#ff8a6a;z-index:4}
</style>
</head>
<body>
<div id="bar">
  <div id="total">
    <div class="label" id="label">Total raised</div>
    <div id="raised">--</div>
    <div id="goal"></div>
  </div>
  <div class="stripes"></div>
  <div id="feed"><div id="track"></div></div>
  <div id="badge"></div>
</div>

<script>
'use strict';
// Optional: paste your Cloudflare Worker address here so you can leave ?proxy= off the URL
const DEFAULT_PROXY = '';
const DEFAULT_API = 'https://hd2clans.com/api/public/heroes26';

// A literal "+" in a team address stays a "+" (use %20 for spaces)
const params = new URLSearchParams(location.search.replace(/\+/g, '%2B'));
const text = name => (params.get(name) || '').trim();
const num = (name, fallback, min, max) => {
  const v = parseFloat(params.get(name));
  return Number.isFinite(v) ? Math.min(max, Math.max(min, v)) : fallback;
};

const DEMO = params.has('demo');
const CAMPAIGN = text('campaign') || text('fundraisers');
const TEAM = text('team');
const PROXY = (text('proxy') || DEFAULT_PROXY).replace(/\/+$/, '');
const API = text('api') || DEFAULT_API;
const DIRECT = Boolean(PROXY && (CAMPAIGN || TEAM || text('proxy')));
const SPEED = num('speed', 90, 20, 400); // pixels per second
const REFRESH = num('refresh', DIRECT ? 15 : 30, DIRECT ? 10 : 5, 3600);
const MAXITEMS = Math.floor(num('maxitems', 5, 1, 50));
const PANELS = (text('panels') || 'campaign,next,donations,milestones,targets,polls,fundraisers,campaigns,donors,teams')
  .split(',').map(x => x.trim().toLowerCase());
const $ = id => document.getElementById(id);

for (const [param, prop] of [['bg', '--page'], ['bar', '--bg'], ['accent', '--accent'],
                             ['text', '--text'], ['subtext', '--dim'], ['track', '--track'], ['font', '--font']]) {
  let v = text(param);
  if (!v) continue;
  if (param !== 'font' && /^([0-9a-f]{3}|[0-9a-f]{6}|[0-9a-f]{8})$/i.test(v)) v = '#' + v;
  document.documentElement.style.setProperty(prop, v);
}
if (['top', 'center'].includes(text('position'))) document.body.className = text('position');

// ?milestones=2500:Costume stream|5000:Hot sauce
const URL_MILESTONES = text('milestones').split('|').map(entry => {
  const [amount, ...name] = entry.split(':');
  return { amount: Number(amount.replace(/[$,\s]/g, '')), name: name.join(':').trim() || 'Milestone' };
}).filter(m => m.amount > 0).sort((a, b) => a.amount - b.amount);

// Sample numbers for layout preview only; the DEMO badge stays on screen
const sample = {
  status: 'ok',
  data: {
    name: 'Sample Charity Campaign', currency: 'USD', raised: 3275, goal: 10000,
    milestones: [
      { name: 'Sample milestone: costume stream', amount: 2500 },
      { name: 'Sample milestone: hot sauce challenge', amount: 5000 },
      { name: 'Sample milestone: 24 hour stream', amount: 7500 },
    ],
    donations: [{ name: 'Sample Donor A', amount: 50 }, { name: 'Sample Donor B', amount: 25 }],
    targets: [{ name: 'Sample target: new loadout', amount: 500, raised: 180 }],
    polls: [{ name: 'Sample poll: next mission', options: [{ name: 'Bugs', raised: 120 }, { name: 'Bots', raised: 95 }] }],
  },
};

let fmt, fmtCurrency;
function money(n, currency) {
  if (currency !== fmtCurrency) {
    fmtCurrency = currency;
    fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency });
  }
  return fmt.format(n || 0).replace(/\.00$/, '');
}

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text != null) node.textContent = text; // API text is never treated as HTML
  return node;
}
// parts: [text, class] pairs
function item(tag, tone, parts) {
  const node = el('div', 'item');
  node.append(el('span', 'tag ' + tone, tag), ...parts.map(([t, c]) => el('span', c, t)));
  return node;
}

function buildItems(s) {
  const d = s.data;
  if (!d) return [item('Status', 'info', [[s.message || 'Waiting for data']])];
  const $$ = n => money(n, d.currency);
  const sections = {
    next: () => progress(d, $$),
    campaign: () => d.name ? [item(d.kind || 'Campaign', '', [[d.name, 'name']])] : [],
    donations: () => (d.donations || []).slice(0, MAXITEMS)
      .map(x => item('Donation', 'good', [[x.name, 'name'], [$$(x.amount), 'val']])),
    milestones: () => (d.milestones || []).map(m => {
      const done = d.raised >= m.amount;
      return item(done ? 'Unlocked' : 'Milestone', done ? 'good' : '', [[$$(m.amount), 'val'], [m.name, 'name']]);
    }),
    targets: () => (d.targets || []).map(t =>
      item('Target', 'info', [[t.name, 'name'], [`${$$(t.raised)} / ${$$(t.amount)}`, 'val']])),
    polls: () => (d.polls || []).map(p => {
      const parts = [[p.name, 'name']];
      for (const o of p.options) parts.push([o.name, 'sub'], [$$(o.raised), 'val']);
      return item('Poll', 'info', parts);
    }),
    fundraisers: () => ranked('Top fundraiser', d.fundraisers, $$),
    campaigns: () => ranked('Campaign', d.campaigns, $$),
    donors: () => ranked('Top donor', d.donors, $$),
    teams: () => ranked('Team', d.teams, $$),
  };
  const out = PANELS.flatMap(key => Object.hasOwn(sections, key) ? sections[key]() : []);
  return out.length ? out : [item('Status', 'info', [['Nothing to show yet']])];
}

// Next milestone, goal progress and event total, each as one line
function progress(d, $$) {
  const out = [];
  const pct = n => [`${n.toFixed(1)}%`, 'val'];
  const next = (d.milestones || []).find(m => m.amount > d.raised);
  if (next) out.push(item('Next milestone', '', [[next.name, 'name'], [$$(next.amount), 'val'],
    [`${$$(next.amount - d.raised)} to go`, 'sub']]));
  if (d.goal) out.push(d.raised >= d.goal
    ? item('Goal reached', 'good', [[$$(d.goal), 'val'], ['Thank you!']])
    : item('Goal', '', [pct(d.raised / d.goal * 100), [`${$$(d.goal - d.raised)} to go`, 'sub']]));
  if (d.event) out.push(item('Event total', 'info', [[$$(d.event.total), 'val'],
    ...(d.event.pct == null ? [] : [pct(d.event.pct), ['of goal', 'sub']])]));
  return out;
}

function ranked(tag, rows, $$) {
  return (rows || []).slice(0, MAXITEMS).map(r => {
    const node = item(r.rank ? `${tag} #${r.rank}` : tag, '', [
      [r.name, 'name'], ...(r.by ? [[`by ${r.by}`, 'sub']] : []), [$$(r.amount), 'val'],
    ]);
    if (/^https?:\/\//i.test(r.avatar || '')) {
      const img = el('img', 'avatar');
      img.alt = '';
      img.onerror = () => { img.style.visibility = 'hidden'; };
      img.src = r.avatar;
      node.firstChild.after(img);
    }
    return node;
  });
}

let shownRaised = null;
function countTo(target, currency) {
  const from = shownRaised ?? target;
  shownRaised = target;
  const start = performance.now();
  (function step(now) {
    if (shownRaised !== target) return;
    const k = Math.min(1, Math.max(0, (now - start) / 1500));
    $('raised').textContent = money(from + (target - from) * (1 - Math.pow(1 - k, 3)), currency);
    if (k < 1) requestAnimationFrame(step);
  })(start);
}

function renderFixed(s) {
  $('badge').textContent = DEMO ? 'DEMO DATA' : s.status === 'stale' ? 'RECONNECTING' : '';
  const d = s.data;
  if (!d) return;
  $('label').textContent = d.label || 'Total raised';
  countTo(d.raised, d.currency);
  $('goal').textContent = d.goal ? `/ ${money(d.goal, d.currency)}` : '';
}

// Seamless scroll: two identical groups; new data swaps in when a loop finishes
let pending = null, loopWidth = 0, offset = 0, last = null, hasData = false;
function mount(s) {
  const track = $('track');
  const group = el('div', 'group');
  track.replaceChildren(group);
  const width = $('feed').clientWidth;
  do { group.append(...buildItems(s)); } while (group.offsetWidth < width);
  loopWidth = group.getBoundingClientRect().width;
  track.append(group.cloneNode(true));
}
function frame(now) {
  if (last !== null) offset += SPEED * Math.min(now - last, 100) / 1000;
  last = now;
  if (loopWidth && offset >= loopWidth) {
    offset -= loopWidth;
    if (pending) { mount(pending); pending = null; }
  }
  $('track').style.transform = `translate3d(${-offset}px,0,0)`;
  requestAnimationFrame(frame);
}

function apply(s) {
  renderFixed(s);
  if (!loopWidth || (!hasData && s.data)) { mount(s); offset = 0; pending = null; }
  else pending = s;
  hasData = hasData || !!s.data;
}

// ---------- Data ----------
const value = v => Number(v && typeof v === 'object' ? v.value : v) || 0;

async function getJson(url) {
  const res = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(12000) });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `Data source returned ${res.status}`);
  }
  return res.json();
}

// Reduces a Tiltify address to "@user/campaign" or "+team/..." for comparing
const path = v => String(v || '').trim().toLowerCase().replace(/[?#].*$/, '')
  .replace(/^(https?:\/\/)?(www\.)?tiltify\.com/, '').replace(/^\/+|\/+$/g, '').replace(/\/profile$/, '');

function findCampaign(rows, wanted) {
  const w = path(wanted);
  const exact = rows.filter(c => path(c.campaign_url) === w);
  if (exact.length) return exact[0];
  // A user name or campaign slug alone only counts if exactly one campaign has it
  for (const test of [c => path(c.campaign_url).split('/')[0].replace(/^@/, '') === w.replace(/^@/, ''),
                      c => String(c.campaign_slug || '').toLowerCase() === w]) {
    const hits = rows.filter(test);
    if (hits.length === 1) return hits[0];
  }
  return null;
}

function findTeam(rows, wanted) {
  const w = path(wanted);
  const bare = x => x.replace(/^\+/, '');
  return rows.find(t => bare(path(t.url)) === bare(w)) ||
         rows.find(t => String(t.name || '').toLowerCase() === wanted.toLowerCase()) || null;
}

// The event feed (hd2clans), which needs no keys
async function loadEvent() {
  const raw = await getJson(API);
  const d = (raw && raw.tiltify) || raw;
  if (!d || d.total_raised == null) throw new Error('The event feed has no total_raised field');
  const person = (x, i) => ({ rank: i + 1, name: x.name, amount: value(x.amount), avatar: x.avatar && x.avatar.src });
  const campaignRow = (c, i) => ({ rank: i + 1, name: c.campaign_name || c.v || 'Campaign', by: c.user_name,
    amount: value(c.amount_raised), avatar: c.user_avatar_url });

  const allCampaigns = d.supporting_campaigns || [], allTeams = d.team_leaderboard || [];
  let campaigns = allCampaigns.map(campaignRow), teams = allTeams.map(person);
  const event = { total: value(d.total_raised), pct: d.pct == null ? null : value(d.pct) };
  let picked = null;

  if (TEAM) {
    const t = findTeam(allTeams, TEAM);
    if (!t) throw new Error(`Team "${TEAM}" is not in the event feed`);
    const row = teams[allTeams.indexOf(t)];
    teams = [row];
    picked = { label: 'Team raised', kind: 'Team', name: row.name, raised: row.amount };
  }
  if (CAMPAIGN) {
    const c = findCampaign(allCampaigns, CAMPAIGN);
    if (!c) throw new Error(`Campaign "${CAMPAIGN}" was not found (use its full Tiltify address)`);
    const row = campaigns[allCampaigns.indexOf(c)];
    campaigns = [{ ...row, rank: null }];
    picked = { label: 'Campaign raised', kind: 'Campaign', name: row.name, raised: row.amount, goal: value(c.goal) };
  }

  return {
    currency: 'USD',
    ...(picked || { label: 'Event raised', kind: 'Event', name: text('name') || 'Heroes 26', raised: event.total, goal: value(d.goal) }),
    event: picked || !value(d.goal) ? event : null,
    // URL milestones win; otherwise use the feed's, but only for the event total
    milestones: URL_MILESTONES.length ? URL_MILESTONES : picked ? [] : (d.milestones || [])
      .map(m => ({ name: m.name, amount: value(m.amount) })).sort((a, b) => a.amount - b.amount),
    fundraisers: (d.fundraisers || []).map(person),
    donors: (d.top_donors || []).map(person),
    campaigns, teams,
  };
}

// Straight from Tiltify, through your proxy
let base = null, previous = {};
async function resolveBase() {
  if (base) return base;
  const input = CAMPAIGN || TEAM;
  if (!input) throw new Error('Add ?campaign= or ?team= to the address');
  const clean = input.replace(/[?#].*$/, '').replace(/\/+$/, '');
  const slug = clean.match(/(?:^|\/)([@+])([^/]+)\/([^/]+)$/);
  if (slug && slug[3] !== 'profile') {
    const type = slug[1] === '+' ? 'team_campaigns' : 'campaigns';
    const body = await getJson(`${PROXY}/api/public/${type}/by/slugs/${encodeURIComponent(slug[2])}/${encodeURIComponent(slug[3])}`);
    base = `/api/public/${type}/${body.data.id}`;
  } else if (/^[\w-]+$/.test(clean)) {
    base = `/api/public/${CAMPAIGN ? 'campaigns' : 'team_campaigns'}/${clean}`;
  } else {
    throw new Error('Use a campaign address such as @user/campaign or +team/campaign');
  }
  return base;
}

async function getAll(route) {
  const rows = [];
  let after = '';
  for (let page = 0; page < 5; page++) {
    const body = await getJson(`${PROXY}${route}?limit=100${after}`);
    rows.push(...(body.data || []));
    const cursor = body.metadata && body.metadata.after;
    if (!cursor || !(body.data || []).length) break;
    after = `&after=${encodeURIComponent(cursor)}`;
  }
  return rows;
}

const open = x => x.active !== false && (!x.ends_at || Date.parse(x.ends_at) > Date.now());

async function loadTiltify() {
  const root = await resolveBase();
  const need = (key, request) => PANELS.includes(key) || key === 'milestones' ? request() : Promise.resolve([]);
  const [campaign, milestones, donations, targets, polls] = await Promise.allSettled([
    getJson(PROXY + root),
    need('milestones', () => getAll(`${root}/milestones`)),
    need('donations', async () => (await getJson(`${PROXY}${root}/donations?limit=20`)).data || []),
    need('targets', () => getAll(`${root}/targets`)),
    need('polls', () => getAll(`${root}/polls`)),
  ]);
  if (campaign.status === 'rejected') throw campaign.reason;
  const c = campaign.value.data;
  const total = c.total_amount_raised || c.amount_raised;
  // If one list fails, keep what we had for it
  const pick = (result, key, map) => {
    if (result.status === 'fulfilled') return (previous[key] = map(result.value));
    console.warn(`Could not load ${key}: ${result.reason.message}`);
    return previous[key] || [];
  };
  const mine = pick(milestones, 'milestones', rows => rows.filter(m => m.active !== false)
    .map(m => ({ name: m.name, amount: value(m.amount) })).sort((a, b) => a.amount - b.amount));
  return {
    label: 'Total raised', kind: root.includes('team_') ? 'Team campaign' : 'Campaign', name: c.name,
    currency: (total && total.currency) || 'USD', raised: value(total), goal: value(c.goal),
    milestones: URL_MILESTONES.length ? URL_MILESTONES : mine,
    donations: pick(donations, 'donations', rows => rows
      .sort((a, b) => String(b.completed_at).localeCompare(String(a.completed_at)))
      .map(d => ({ name: d.donor_name || 'Anonymous', amount: value(d.amount) }))),
    targets: pick(targets, 'targets', rows => rows.filter(open)
      .map(t => ({ name: t.name, amount: value(t.amount), raised: value(t.amount_raised) }))),
    polls: pick(polls, 'polls', rows => rows.filter(open)
      .map(p => ({ name: p.name, options: (p.options || []).map(o => ({ name: o.name, raised: value(o.amount_raised) })) }))),
  };
}

let latest = null;
async function refresh() {
  try {
    latest = await (DIRECT ? loadTiltify() : loadEvent());
    apply({ status: 'ok', data: latest });
  } catch (e) {
    console.error('Ticker:', e.message);
    if (latest) $('badge').textContent = 'RECONNECTING';
    else apply({ status: 'error', message: e.message });
  }
  setTimeout(refresh, REFRESH * 1000);
}

// Wait briefly for the web fonts so widths are measured correctly
Promise.race([
  Promise.allSettled([document.fonts.load('24px "FSSinclair"'), document.fonts.load('600 24px "Barlow Condensed"')]),
  new Promise(r => setTimeout(r, 1500)),
]).then(() => {
  if (DEMO) apply(sample); else refresh();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
